; PlatformIO Project Configuration — symon
;
; Hardware:
;   - Olimex ESP32-C3-DevKit-Lipo (or compatible ESP32-C3 board)
;   - SSD1306 128×64 OLED display (I2C, 0x3C)
;   - Adafruit Seesaw ANO Rotary Navigation Encoder (I2C, 0x49)
;
; Build:
;   cd symon
;   pio run                  # compile
;   pio run -t upload        # compile and flash
;   pio device monitor       # serial monitor (115200)
;
; Edit src/config.h to set WiFi credentials, OSC target, and message options.

[env:symon]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit seesaw Library
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit BusIO
    MicroOSC=https://github.com/halfsohappy/MicroOsc
